[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyuml2"
version = "0.0.1.dev0"
description = "PyEcore-generated UML model with manual runtime mixins"
readme = "README.rst"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENCE"]
authors = [{name = "Vincent Aranega", email = "vincent.aranega@gmail.com"}]
dependencies = ["pyecore"]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
generation = ["pyecoregen"]
test = ["pytest>=9.0.3"]

[tool.setuptools.packages.find]
include = ["pyuml2*"]

[tool.setuptools.package-data]
"pyuml2.uml" = ["*.skeleton"]

[tool.setuptools.data-files]
"share/pyuml2/model" = ["model/*.ecore", "model/PROVENANCE.md"]
